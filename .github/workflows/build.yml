name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支只保留最新一次构建：连续推送时自动取消旧任务，
# 避免一次基础设施抖动就刷出一堆失败邮件。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    # 防止下载卡死时占用 6 小时
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 注意：不要再传 gradle-version。
      # 本项目用仓库自带的 ./gradlew（wrapper 已锁定 9.1.0），
      # 额外让 setup-gradle 再下载一份 Gradle 既浪费又会多一个失败点。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: backrooms_complex-jar
          path: build/libs/*.jar
          if-no-files-found: error
