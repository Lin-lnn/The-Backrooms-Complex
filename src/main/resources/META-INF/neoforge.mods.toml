# NeoForge 模组元数据文件（1.21.1 格式）
modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
BackroomsComplex（后室综合体）—— 一个无限延伸、昏暗压抑的阈限空间维度。
特点：
- 独立维度，无天空光、恒定时间、床与重生锚均不可用。
- 由自定义 ChunkGenerator 生成的无限地牢：1~7 格可变宽度走廊，逐层独立种子（每层布局完全不同），多层堆叠。
- 层间连通由 NBT 特定结构（backrooms_complex:level0）承担；结构会覆盖地形，但绝不破坏基岩。
- 3 种群系（黄色壁纸 / 灰色混凝土 / 潮湿发霉），不同墙壁花纹；本模组不生成任何战利品箱或物资。
- 方块在生存模式不可破坏（创造模式可正常破坏），照明依赖荧光灯。
- 新增「枢纽之门」与「阈界的层级密钥」：手持密钥右键门即可进入 Level 0。
'''
logoFile="logo.png"   # 模组图标：黄色墙壁（128x128）

# ===== 依赖声明 =====
# NeoForge 依赖
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

# Minecraft 依赖
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"
