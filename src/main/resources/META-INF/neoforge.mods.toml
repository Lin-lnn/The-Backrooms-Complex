# NeoForge 模组元数据文件（1.21.1 格式）
modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
BackroomsComplex（后室综合体）—— 一个无限延伸、昏暗压抑的阈限空间。
特点：
- 独立维度，无天空光、恒定时间、床与重生锚均不可用。
- Level 0：自定义 ChunkGenerator 生成的无限地牢，1~7 格可变宽度走廊，逐层独立布局，多层堆叠。
- Level 1「宜居地带」：层高 12 格的两层停车场，天鹰 / 跃金 / 哥特 / 衔尾 / 花园 / 传说等区段，金属门与板条箱。
- Level 0 只有一种黄色房间群系；Level 1 的区段群系随楼层切换。
- 没有理智值、幻视或随机事件；方块使用预先着色的贴图，不依赖运行时染色。
- 方块在生存模式不可破坏（创造模式可正常破坏），照明依赖荧光灯。
- 「枢纽之门」「阈界的层级密钥」与「神秘的门」构成层级之间的通路。
'''
logoFile="logo.png"   # 模组图标：黄色墙壁（128x128）

# ===== 依赖声明 =====
# NeoForge 依赖
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

# Minecraft 依赖
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"
